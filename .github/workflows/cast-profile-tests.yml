name: Cast profile tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Profile and playback boundary tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax without writing cache files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('resources/lib').rglob('*.py'):
              ast.parse(path.read_bytes(), filename=str(path))
          PY
