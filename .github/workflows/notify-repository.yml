name: Notify Repository

on:
  workflow_run:
    workflows: [Add-on Validations]
    types: [completed]
    branches: [master]

jobs:
  validate-evidence:
    name: Validate Publication Evidence
    if: >-
      github.repository == 'Serph91P/plugin.video.youtube' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      addon_version: ${{ steps.evidence.outputs.addon_version }}
      asset_name: ${{ steps.evidence.outputs.asset_name }}
      artifact_sha256: ${{ steps.evidence.outputs.artifact_sha256 }}
      publication_id: ${{ steps.evidence.outputs.publication_id }}
    steps:
      - name: Download validation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validation-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate and extract evidence
        id: evidence
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ADDON_ID = "plugin.video.youtube"
          EVIDENCE_PATH = Path("validation-evidence.json")
          MAX_EVIDENCE_BYTES = 64 * 1024
          SHA_RE = re.compile(r"^[0-9a-f]{40}$", re.ASCII)
          SHA256_RE = re.compile(r"^[0-9a-f]{64}$", re.ASCII)
          VERSION_RE = re.compile(
              r"^[0-9]+(?:\.[0-9]+)*(?:\+[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$",
              re.ASCII,
          )

          def reject_duplicate_fields(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate evidence field")
                  value[key] = item
              return value

          if not EVIDENCE_PATH.is_file() or EVIDENCE_PATH.is_symlink():
              raise SystemExit("Validation evidence file is missing or invalid")
          raw = EVIDENCE_PATH.read_bytes()
          if not raw or len(raw) > MAX_EVIDENCE_BYTES:
              raise SystemExit("Validation evidence size is invalid")
          try:
              evidence = json.loads(
                  raw.decode("utf-8"), object_pairs_hook=reject_duplicate_fields
              )
          except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
              raise SystemExit("Validation evidence JSON is malformed") from error

          required_fields = {
              "validation_run_id",
              "candidate_sha",
              "validation_head_sha",
              "addon_id",
              "addon_version",
              "asset_name",
              "artifact_sha256",
              "publication_id",
          }
          if not isinstance(evidence, dict):
              raise SystemExit("Validation evidence must be an object")
          fields = set(evidence)
          if fields not in (required_fields, required_fields | {"tag"}):
              raise SystemExit("Validation evidence fields do not match contract")
          if "tag" in evidence and evidence["tag"] != "":
              raise SystemExit("Optional validation evidence tag must be empty")

          try:
              run_id = int(os.environ["RUN_ID"])
          except ValueError as error:
              raise SystemExit("Triggering validation run ID is invalid") from error
          head_sha = os.environ["RUN_HEAD_SHA"]
          if run_id <= 0 or not SHA_RE.fullmatch(head_sha):
              raise SystemExit("Triggering validation identity is invalid")
          if type(evidence["validation_run_id"]) is not int:
              raise SystemExit("Evidence validation run ID must be an integer")
          string_fields = required_fields - {"validation_run_id"}
          if any(not isinstance(evidence[field], str) for field in string_fields):
              raise SystemExit("Evidence identity fields must be strings")
          if evidence["validation_run_id"] != run_id:
              raise SystemExit("Evidence validation run ID does not match trigger")
          if evidence["candidate_sha"] != head_sha:
              raise SystemExit("Evidence candidate SHA does not match trigger")
          if evidence["validation_head_sha"] != head_sha:
              raise SystemExit("Evidence validation head SHA does not match trigger")
          if evidence["addon_id"] != ADDON_ID:
              raise SystemExit("Evidence add-on ID does not match YouTube")

          version = evidence["addon_version"]
          if not VERSION_RE.fullmatch(version):
              raise SystemExit("Evidence add-on version is invalid")
          if evidence["asset_name"] != f"{ADDON_ID}-{version}.zip":
              raise SystemExit("Evidence package filename does not match identity")
          if not SHA256_RE.fullmatch(evidence["artifact_sha256"]):
              raise SystemExit("Evidence package SHA-256 is invalid")
          if evidence["publication_id"] != f"{ADDON_ID}@{version}":
              raise SystemExit("Evidence publication ID does not match identity")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as output:
              for field in (
                  "addon_version",
                  "asset_name",
                  "artifact_sha256",
                  "publication_id",
              ):
                  output.write(f"{field}={evidence[field]}\n")
          PY

  notify:
    name: Notify Repository
    needs: validate-evidence
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: Serph91P/repository.serph91p/.github/workflows/reusable-notify-repository.yml@6ed69ffc333f07664a9f9b52bc16a92812a939f1
    with:
      source_repository: ${{ github.repository }}
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      validation_run_id: ${{ github.event.workflow_run.id }}
      validation_workflow: Add-on Validations
      validation_workflow_path: .github/workflows/addon-validations.yml
      validation_event: ${{ github.event.workflow_run.event }}
      expected_branch: master
      addon_id: plugin.video.youtube
      addon_version: ${{ needs.validate-evidence.outputs.addon_version }}
      asset_name: ${{ needs.validate-evidence.outputs.asset_name }}
      artifact_sha256: ${{ needs.validate-evidence.outputs.artifact_sha256 }}
      publication_id: ${{ needs.validate-evidence.outputs.publication_id }}
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
